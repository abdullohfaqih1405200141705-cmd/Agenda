          cat > "$R/values/widget_strings.xml" <<'END_13'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="widget_desc">Hitung mundur terdekat, capaian, dan semua kegiatan hari ini</string>
              <string name="widget_cd_desc">Semua acara yang sedang dihitung mundur</string>
              <string name="widget_name_tasks">Yaumiyah ku · Kegiatan</string>
              <string name="widget_name_cd">Yaumiyah ku · Hitung Mundur</string>
          </resources>
          END_13
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          r='''
              <receiver android:name="id.yaumiyahqu.app.WidgetProvider" android:label="@string/widget_name_tasks" android:exported="false">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  </intent-filter>
                  <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info" />
              </receiver>
              <receiver android:name="id.yaumiyahqu.app.CountdownProvider" android:label="@string/widget_name_cd" android:exported="false">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  </intent-filter>
                  <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_countdown_info" />
              </receiver>
              <service android:name="id.yaumiyahqu.app.TaskService" android:permission="android.permission.BIND_REMOTEVIEWS" android:exported="false" />
              <service android:name="id.yaumiyahqu.app.CountdownService" android:permission="android.permission.BIND_REMOTEVIEWS" android:exported="false" />
          '''
          assert '</application>' in s
          open(p,'w').write(s.replace('</application>',r+'    </application>',1))
          PY

      - name: Kompilasi APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ganti nama berkas
        run: cp android/app/build/outputs/apk/debug/app-debug.apk YaumiyahKu.apk

      - name: Simpan sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: YaumiyahKu-apk
          path: YaumiyahKu.apk

      - name: Terbitkan di Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" YaumiyahKu.apk \
            --title "Yaumiyah ku v${{ github.run_number }}" \
            --notes "APK siap pasang. Unduh YaumiyahKu.apk lalu ketuk untuk memasang."
