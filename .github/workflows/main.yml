name: Bangun APK YaumiyahQu

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setujui lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pasang dependensi dan siapkan aset web
        run: |
          npm install
          mkdir -p www
          if [ -f src/index.html ]; then cp src/index.html www/index.html; else cp index.html www/index.html; fi

      - name: Buat dan sinkronkan proyek Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Kompilasi APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ganti nama berkas
        run: cp android/app/build/outputs/apk/debug/app-debug.apk YaumiyahQu.apk

      - name: Simpan sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: YaumiyahQu-apk
          path: YaumiyahQu.apk

      - name: Terbitkan di Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" YaumiyahQu.apk \
            --title "YaumiyahQu v${{ github.run_number }}" \
            --notes "APK siap pasang. Unduh YaumiyahQu.apk lalu ketuk untuk memasang."
