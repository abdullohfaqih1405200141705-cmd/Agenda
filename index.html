<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064e3b">
<title>YaumiyahQu</title>
<style>
:root{--bg:#f4f7f5;--cd:#fff;--tx:#17231e;--mu:#5d7068;--g:#0b6b4f;--gs:#e3f2ec;--am:#d98e04;--bd:#dde7e2;--gd:#064e3b;--ac:#0b6b4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1713;--cd:#15231d;--tx:#e6f0eb;--mu:#93aaa0;--g:#3ecf9b;--gs:#1b3329;--am:#f5b73c;--bd:#26382f;--gd:#022c22}}
:root[data-theme="dark"]{--bg:#0c1713;--cd:#15231d;--tx:#e6f0eb;--mu:#93aaa0;--g:#3ecf9b;--gs:#1b3329;--am:#f5b73c;--bd:#26382f;--gd:#022c22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}[hidden]{display:none!important}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--gd);color:#fff;font-weight:700}
.top button{color:#fff;font-size:20px;padding:0 6px}
#app{max-width:640px;margin:0 auto;padding:12px 12px 100px}
.card,.card2{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px}
.card2{background:var(--gs);border-color:transparent}
small,.mu{color:var(--mu);font-size:12px}small{display:block}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{flex:1;padding:10px 0;font-weight:600;color:var(--mu)}.nav button[aria-selected=true]{color:var(--g);box-shadow:inset 0 3px var(--am)}
.dn{display:flex;align-items:center;gap:6px}.dn h2{flex:1;margin:0;font-size:16px;text-align:center}
#ydate{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0}
.ib{width:38px;height:38px;border-radius:12px;background:var(--gs);color:var(--g);font-weight:700}
.pill{padding:6px 12px;border-radius:99px;background:var(--gs);color:var(--g);font-weight:600;white-space:nowrap;font-size:13px}.pill.on{background:var(--g);color:var(--bg)}
.sc{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.day{min-width:64px;padding:6px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);text-align:center;font-size:12px}.day.on{border-color:var(--am);background:var(--gd);color:#fff}
.big{font-size:34px;font-weight:800;color:var(--g)}
.pb{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:var(--ac,var(--g));transition:width .4s}
.sh2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;gap:6px;padding:8px 0;border-top:1px solid var(--bd)}.row label{display:flex;gap:10px;flex:1;align-items:flex-start}.row.ok label span{opacity:.55;text-decoration:line-through}.row label{margin:0;font-weight:400;font-size:15px}
.chk{appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--g);border-radius:8px;background:var(--cd);display:grid;place-content:center}.chk:checked{background:var(--g)}.chk:checked::before{content:"✓";color:var(--bg);font-weight:800}
.cat{font-style:normal;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--gs);color:var(--g);margin:2px 4px 0 0;display:inline-block}.cat.rp{background:#fde8d4;color:#9a4b00}
.ic{width:34px;height:34px;font-size:15px}
.add{width:100%;padding:8px;border-radius:10px;border:1px dashed var(--g);color:var(--g);font-weight:600;margin-top:6px}
.em{color:var(--mu);font-size:13px;margin:4px 0}
.bars{display:flex;gap:6px;align-items:flex-end;height:140px}.bars div{flex:1;text-align:center;font-size:11px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;background:var(--g);border-radius:6px 6px 0 0;min-height:2px}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:8px 4px;border-top:1px solid var(--bd)}
.pri{width:100%;padding:12px;border-radius:12px;background:var(--g);color:var(--bg);font-weight:700;margin-top:14px}
.sec{flex:1;padding:10px;border-radius:12px;background:var(--gs);color:var(--g);font-weight:600}.dng{color:#c62828}.lnk{color:var(--g);font-weight:600}
.act{display:flex;gap:8px;margin-top:12px}
.hero{background:color-mix(in srgb,var(--ac) 9%,var(--cd));border:1px solid color-mix(in srgb,var(--ac) 40%,var(--bd));border-radius:20px;padding:14px;margin-bottom:12px}
.hero h2{margin:6px 0 2px;font-size:20px}
.dg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 6px}.dg div{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px 0;text-align:center;font-size:12px;color:var(--mu)}.dg b{display:block;font-size:30px;line-height:1.1;color:var(--ac);font-variant-numeric:tabular-nums}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--gs);color:var(--g);font-weight:600;font-size:12px}
.tc{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--am);color:#1b1200;font-size:30px;font-weight:700;box-shadow:0 4px 14px #0004;z-index:6}
#sheet{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}
#sheetBox{background:var(--cd);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sht{display:flex;justify-content:space-between;align-items:center;font-size:17px;margin-bottom:4px}.sht button{font-size:20px;padding:4px 8px}
label{display:block;margin-top:10px;font-weight:600;font-size:13px}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
textarea{min-height:90px}.rd{display:flex;gap:8px;align-items:flex-start;font-weight:500}.rd input{margin-top:4px}
fieldset{border:1px solid var(--bd);border-radius:12px;margin:12px 0 0}.g3{display:grid;grid-template-columns:1fr 2fr 1.2fr;gap:6px}
.err{color:#c62828;font-size:13px;margin-top:8px;min-height:1em}
.meta{margin:10px 0 0}.meta div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--bd);font-size:13px}.meta dd{margin:0;text-align:right;font-weight:600}
#toasts{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;z-index:30;pointer-events:none}
.toast{background:var(--gd);color:#fff;padding:10px 14px;border-radius:12px;pointer-events:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}.toast button{color:var(--am);font-weight:700}
.top{display:block;padding:12px 16px 14px;border-radius:0 0 20px 20px}
.tr{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.hk{margin:6px 0 0;font-size:12.5px;line-height:1.5;color:#cfe8dd;font-weight:400}
#app{padding-top:14px}
.kpi{display:flex;align-items:center;gap:14px}
.ring{--p:0;flex:none;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--bd) 0)}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--cd)}
.ring span{position:relative;font-size:20px;font-weight:800;color:var(--g)}
.slot-h{cursor:pointer}.row .ic{opacity:.55}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="tr"><span>☪ YaumiyahQu</span></div><p id="hk" class="hk"></p></header>
<main id="app">
<div id="ty">
 <div class="dn"><button class="ib" data-go="prev" aria-label="Hari sebelumnya">◀</button><h2 id="yt"></h2><button class="ib" data-go="next" aria-label="Hari berikutnya">▶</button><label class="ib" style="margin:0;position:relative;display:grid;place-items:center">📅<input id="ydate" type="date" aria-label="Pilih tanggal"></label></div>
 <div class="sc" style="margin-top:10px"><button class="pill on" id="vj" data-go="yv|yj">📝 Jurnal</button><button class="pill" id="vr" data-go="yv|yr">📊 Rekap</button><button class="pill" data-go="today">Hari ini</button></div>
 <div id="yj">
  <div class="card kpi" id="kcard"><div class="ring" id="kr"><span id="kp">0%</span></div><div style="flex:1"><b id="kl"></b><small id="kc"></small><button class="pill" data-go="reset" style="margin-top:8px">Ulangi hari ini</button></div></div>
  <div class="sc" id="dt"></div>
  <div class="sc" id="cf"></div>
  <div id="sl"></div>
  <div class="act"><button class="sec" data-go="ts">🕒 Tambah jam</button></div>
 </div>
 <div id="yr" hidden>
  <div class="card"><b>Capaian 7 hari terakhir</b><div class="bars" id="ch" style="margin-top:10px"></div></div>
  <div class="card"><b>Capaian per kategori (hari ini)</b><div id="cp"></div></div>
  <div class="card"><b>Riwayat 10 hari</b><table><tbody id="hs"></tbody></table></div>
 </div>
</div>
<div id="tc" hidden>
 <p class="mu" id="th" style="margin:0 0 10px"></p>
 <div class="hero" id="hero" data-go="hero"><span class="bd" id="hb">Acara terdekat</span><h2 id="hn"></h2><small id="hh"></small><small id="hm"></small>
  <div class="dg"><div><b id="g-d">00</b>hari</div><div><b id="g-h">00</b>jam</div><div><b id="g-m">00</b>menit</div><div><b id="g-s">00</b>detik</div></div>
  <div class="pb"><i id="hp"></i></div><small id="hpt"></small><p id="hdesc" class="mu" style="margin:6px 0 0"></p></div>
 <div class="dn" style="margin-bottom:8px"><b style="flex:1">Daftar acara (<span id="cn">0</span>)</b><button class="pill on" id="au" data-go="auto"></button></div>
 <div id="cl"></div>
</div>
</main>
<button class="fab" id="fab" data-go="fab" aria-label="Tambah">+</button>
<nav class="nav"><button id="n-y" data-go="tab|y" aria-selected="true">📝 Yaumiyah</button><button id="n-c" data-go="tab|c" aria-selected="false">⏳ Hitung Mundur</button></nav>
<div id="toasts" aria-live="polite"></div>
<div id="sheet" hidden><div id="sheetBox" role="dialog" aria-modal="true"></div></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),KEY='yaumiyahqu_app_v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(Math.max(0,Math.floor(n))).padStart(2,'0'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DAYS=['Ahad','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const CATS=[['Adminda','📋'],['Ubudiyah','🕌'],['Taklimiyah','📖'],['PSD','👥'],['Kapok','📌'],['Kesehatan','🌿'],['Wakepda','🏛️'],['Kada','⭐'],['Pribadi','🏠']],CI=Object.fromEntries(CATS);
const SL=[['04:00','06:00','Subuh, dzikir & tilawah'],['06:00','08:00','Pagi & Dhuha'],['08:00','12:00','Kegiatan pagi–siang'],['12:00','15:30','Dzuhur & siang'],['15:30','18:00','Ashar & dzikir sore'],['18:00','21:30','Maghrib, Isya & taklimiyah']];
const AC=[
['Tahajud, Subuh berjamaah & dzikir pagi|Ubudiyah','Olahraga pagi|Kesehatan','Rencana program pekan ini|Kada','Dzuhur & silaturahmi keluarga|Pribadi','Siapkan berkas mingguan|Adminda','Kajian malam & murojaah|Taklimiyah'],
['Sahur puasa Senin, Subuh & dzikir|Ubudiyah','Shalat Dhuha & koordinasi awal pekan|Kada','Cek surat & laporan harian|Adminda','Dzuhur & rapat koordinasi|Wakepda','Pembinaan anggota|PSD','Buka puasa, Maghrib & kajian kitab|Taklimiyah'],
['Qiyamul lail, Subuh & tilawah|Ubudiyah','Senam pagi & Dhuha|Kesehatan','Pelaksanaan target kelompok|Kapok','Dzuhur & pendataan|Adminda','Evaluasi kaderisasi|PSD','Maghrib, Isya & mudzakarah|Taklimiyah'],
['Tahajud, Subuh & dzikir pagi|Ubudiyah','Jalan pagi & Dhuha|Kesehatan','Evaluasi tengah pekan|Wakepda','Dzuhur & pantau capaian|Kapok','Ashar, dzikir sore & urusan pribadi|Pribadi','Kajian sirah atau fiqih malam|Taklimiyah'],
['Sahur puasa Kamis & Subuh|Ubudiyah','Shalat Dhuha & supervisi|Kada','Rekap administrasi & arsip|Adminda','Dzuhur & pengembangan SDM|PSD','Ashar & doa menjelang buka puasa|Ubudiyah','Buka puasa & baca Al-Kahfi malam Jumat|Taklimiyah'],
['Tahajud, Subuh & Al-Kahfi|Ubudiyah','Mandi sunnah, olahraga & Dhuha|Kesehatan','Tuntaskan laporan mingguan|Adminda','Bersegera shalat Jumat & dzikir|Ubudiyah','Evaluasi akhir pekan & doa sore|Wakepda','Maghrib, Isya & waktu keluarga|Pribadi'],
['Qiyamul lail, Subuh & murojaah|Ubudiyah','Olahraga & istirahat|Kesehatan','Majelis ilmu & pembinaan|Taklimiyah','Dzuhur & evaluasi ringan|Kapok','Ashar, dzikir petang & urusan pribadi|Pribadi','Muhasabah akhir pekan|Kada']];
const ymd=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`,pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)},dow=s=>pd(s).getDay();
const fmtD=s=>{const d=pd(s);return`${DAYS[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`};
const DRE=/^\d{4}-\d\d-\d\d$/,TH_OK=['dynamic','red','orange','gold','green','blue','neutral'];

/* ---------- Data ---------- */
let DB,Y,C,cat='ALL',curD=null,sig='',lastDay='';
const fresh=()=>{const t=ymd(new Date());return{tab:'y',yq:{sch:{},chk:{},carry:[],date:t,last:t},cd:{list:[],auto:true,active:null}}};
const valid=o=>o&&o.yq&&o.cd&&typeof o.yq.sch==='object'&&typeof o.yq.chk==='object'&&Array.isArray(o.yq.carry)&&Array.isArray(o.cd.list);
function cleanItem(i){if(!i||!i.name||!i.target)return null;const t=new Date(i.target);if(isNaN(t))return null;const c=new Date(i.created||i.createdAt);
 return{id:String(i.id||'cd-'+uid()).replace(/[^\w-]/g,''),name:String(i.name).trim().slice(0,80),desc:String(i.desc??i.description??'').trim().slice(0,1000),theme:TH_OK.includes(i.theme||i.colorTheme)?(i.theme||i.colorTheme):'dynamic',target:t.toISOString(),created:(isNaN(c)?new Date():c).toISOString(),done:!!(i.done??i.notified)}}
function clean(o){if(!valid(o))throw new Error('Format cadangan tidak dikenal');const f=fresh(),s=x=>String(x??'').slice(0,120);
 for(let d=0;d<7;d++){const z=o.yq.sch[d];if(z&&Array.isArray(z.slots)&&Array.isArray(z.acts))f.yq.sch[d]={slots:z.slots.map(a=>({id:s(a.id),s:s(a.s),e:s(a.e),l:s(a.l)})),acts:z.acts.map(a=>({id:s(a.id),sl:s(a.sl),t:s(a.t),c:CI[a.c]?a.c:'Pribadi'}))}}
 Object.keys(o.yq.chk).forEach(k=>{const v=o.yq.chk[k];if(DRE.test(k)&&v&&typeof v==='object')f.yq.chk[k]=Object.fromEntries(Object.keys(v).filter(i=>v[i]).map(i=>[i,1]))});
 f.yq.carry=o.yq.carry.filter(c=>c&&c.id&&DRE.test(c.date)).map(c=>({id:s(c.id),t:s(c.t),c:CI[c.c]?c.c:'Pribadi',date:c.date,s:s(c.s),e:s(c.e),l:s(c.l)}));
 if(DRE.test(o.yq.date))f.yq.date=o.yq.date;f.cd.list=o.cd.list.map(cleanItem).filter(Boolean).slice(0,200);f.cd.auto=o.cd.auto!==false;f.cd.active=o.cd.active||null;f.tab=o.tab==='c'?'c':'y';return f}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o)return clean(o)}catch(e){console.warn('Data tersimpan tidak terbaca, memulai baru',e)}return fresh()}
function bind(){Y=DB.yq;C=DB.cd}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){console.error(e);toast('Data belum bisa disimpan. Penyimpanan penuh atau diblokir.')}}
function toast(m,label,fn){const t=document.createElement('div');t.className='toast';t.textContent=m;if(fn){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{fn();t.remove()};t.append(b)}$('#toasts').append(t);setTimeout(()=>t.remove(),fn?7000:4000)}
function undoable(msg,fn){const s=JSON.stringify(DB);fn();save();rAll();toast(msg,'Urungkan',()=>{DB=JSON.parse(s);bind();save();rAll()})}

/* ---------- Sheet ---------- */
function sheet(title,body){const b=$('#sheetBox');b.innerHTML=`<div class="sht"><b>${title}</b><button data-close aria-label="Tutup">✕</button></div>${body}`;$('#sheet').hidden=false;return b}
function closeSheet(){$('#sheet').hidden=true;curD=null}

/* ---------- Yaumiyah ---------- */
function day(d){if(!Y.sch[d])Y.sch[d]={slots:SL.map((s,i)=>({id:`d${d}s${i}`,s:s[0],e:s[1],l:s[2]})),acts:AC[d].map((a,i)=>{const[t,c]=a.split('|');return{id:`d${d}a${i}`,sl:`d${d}s${i}`,t,c}})};return Y.sch[d]}
const doneOn=id=>Object.keys(Y.chk).sort().find(d=>Y.chk[d]&&Y.chk[d][id]);
const carryVis=(c,ds)=>{const d=doneOn(c.id);return ds>=c.date&&!(d&&d<ds)};
function eff(ds){const b=day(dow(ds)),slots=b.slots.map(s=>({...s})),acts=b.acts.map(a=>({...a,carry:0}));
 Y.carry.forEach(c=>{if(!carryVis(c,ds))return;let s=slots.find(x=>x.s===c.s)||slots[0];if(!s){s={id:'v'+c.id,s:c.s,e:c.e,l:c.l};slots.push(s)}acts.push({id:c.id,sl:s.id,t:c.t,c:c.c,carry:1})});
 return{slots:slots.sort((a,b)=>a.s.localeCompare(b.s)),acts}}
function stats(ds){const e=eff(ds),ck=Y.chk[ds]||{},n=e.acts.length,dn=e.acts.filter(a=>ck[a.id]).length;let sa=0,sd=0;
 e.slots.forEach(s=>{const l=e.acts.filter(a=>a.sl===s.id);if(l.length){sa++;if(l.every(a=>ck[a.id]))sd++}});
 return{n,dn,pct:n?Math.round(dn/n*100):0,sa,sd,cy:e.acts.filter(a=>a.carry&&!ck[a.id]).length}}
function rY(){const ds=Y.date,d=dow(ds),st=stats(ds),e=eff(ds),ck=Y.chk[ds]||{};
 $('#ydate').value=ds;$('#yt').textContent=fmtD(ds);$('#kp').textContent=st.pct+'%';$('#kr').style.setProperty('--p',st.pct);
 $('#kl').textContent=st.pct>=85?'Mumtaz (sangat baik)':st.pct>=65?'Jayyid (baik)':'Semangat, terus istiqamah';
 $('#kc').textContent=`${st.dn}/${st.n} kegiatan · ${st.sd}/${st.sa} jam tuntas · ${st.cy} tugas menunggu`;
 $('#dt').innerHTML=DAYS.map((n,i)=>{const s=stats(addD(ds,i-d));return`<button class="day${i===d?' on':''}" data-go="day|${i}"><b>${n}</b><br>${s.pct}%</button>`}).join('');
 $('#cf').innerHTML=['ALL',...CATS.map(c=>c[0])].map(c=>`<button class="pill${c===cat?' on':''}" data-go="cat|${c}">${c==='ALL'?'Semua':CI[c]+' '+c}</button>`).join('');
 const show=e.acts.filter(a=>cat==='ALL'||(a.c===cat&&!ck[a.id]));
