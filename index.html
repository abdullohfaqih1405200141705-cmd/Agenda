<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Yaumiyah ku</title>
<style>
:root{--bg:#f4f7f5;--cd:#fff;--tx:#17231e;--mu:#5d7068;--g:#0b6b4f;--gs:#e3f2ec;--am:#d98e04;--bd:#dde7e2;--gd:#064e3b;--ac:#0b6b4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1713;--cd:#15231d;--tx:#e6f0eb;--mu:#93aaa0;--g:#3ecf9b;--gs:#1b3329;--am:#f5b73c;--bd:#26382f;--gd:#022c22}}
:root[data-theme="dark"]{--bg:#0c1713;--cd:#15231d;--tx:#e6f0eb;--mu:#93aaa0;--g:#3ecf9b;--gs:#1b3329;--am:#f5b73c;--bd:#26382f;--gd:#022c22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}[hidden]{display:none!important}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--gd);color:#fff;font-weight:700}
.top button{color:#fff;font-size:20px;padding:0 6px}
#app{max-width:640px;margin:0 auto;padding:12px 12px 100px}
.card,.card2{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px}
.card2{background:var(--gs);border-color:transparent}
small,.mu{color:var(--mu);font-size:12px}small{display:block}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{flex:1;padding:10px 0;font-weight:600;color:var(--mu)}.nav button[aria-selected=true]{color:var(--g);box-shadow:inset 0 3px var(--am)}
.dn{display:flex;align-items:center;gap:6px}.dn h2{flex:1;margin:0;font-size:16px;text-align:center}
#ydate{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0}
.ib{width:38px;height:38px;border-radius:12px;background:var(--gs);color:var(--g);font-weight:700}
.pill{padding:6px 12px;border-radius:99px;background:var(--gs);color:var(--g);font-weight:600;white-space:nowrap;font-size:13px}.pill.on{background:var(--g);color:var(--bg)}
.sc{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.day{min-width:64px;padding:6px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);text-align:center;font-size:12px}.day.on{border-color:var(--am);background:var(--gd);color:#fff}
.big{font-size:34px;font-weight:800;color:var(--g)}
.pb{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:var(--ac,var(--g));transition:width .4s}
.sh2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;gap:6px;padding:8px 0;border-top:1px solid var(--bd)}.row label{display:flex;gap:10px;flex:1;align-items:flex-start}.row.ok label span{opacity:.55;text-decoration:line-through}.row label{margin:0;font-weight:400;font-size:15px}
.chk{appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--g);border-radius:8px;background:var(--cd);display:grid;place-content:center}.chk:checked{background:var(--g)}.chk:checked::before{content:"✓";color:var(--bg);font-weight:800}
.cat{font-style:normal;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--gs);color:var(--g);margin:2px 4px 0 0;display:inline-block}.cat.rp{background:#fde8d4;color:#9a4b00}
.ic{width:34px;height:34px;font-size:15px}
.add{width:100%;padding:8px;border-radius:10px;border:1px dashed var(--g);color:var(--g);font-weight:600;margin-top:6px}
.em{color:var(--mu);font-size:13px;margin:4px 0}
.bars{display:flex;gap:6px;align-items:flex-end;height:140px}.bars div{flex:1;text-align:center;font-size:11px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;background:var(--g);border-radius:6px 6px 0 0;min-height:2px}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:8px 4px;border-top:1px solid var(--bd)}
.pri{width:100%;padding:12px;border-radius:12px;background:var(--g);color:var(--bg);font-weight:700;margin-top:14px}
.sec{flex:1;padding:10px;border-radius:12px;background:var(--gs);color:var(--g);font-weight:600}.dng{color:#c62828}.lnk{color:var(--g);font-weight:600}
.act{display:flex;gap:8px;margin-top:12px}
.hero{background:color-mix(in srgb,var(--ac) 9%,var(--cd));border:1px solid color-mix(in srgb,var(--ac) 40%,var(--bd));border-radius:20px;padding:14px;margin-bottom:12px}
.hero h2{margin:6px 0 2px;font-size:20px}
.dg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 6px}.dg div{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px 0;text-align:center;font-size:12px;color:var(--mu)}.dg b{display:block;font-size:30px;line-height:1.1;color:var(--ac);font-variant-numeric:tabular-nums}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--gs);color:var(--g);font-weight:600;font-size:12px}
.tc{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--am);color:#1b1200;font-size:30px;font-weight:700;box-shadow:0 4px 14px #0004;z-index:6}
#sheet{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}
#sheetBox{background:var(--cd);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sht{display:flex;justify-content:space-between;align-items:center;font-size:17px;margin-bottom:4px}.sht button{font-size:20px;padding:4px 8px}
label{display:block;margin-top:10px;font-weight:600;font-size:13px}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
textarea{min-height:90px}.rd{display:flex;gap:8px;align-items:flex-start;font-weight:500}.rd input{margin-top:4px}
fieldset{border:1px solid var(--bd);border-radius:12px;margin:12px 0 0}.g3{display:grid;grid-template-columns:1fr 2fr 1.2fr;gap:6px}
.err{color:#c62828;font-size:13px;margin-top:8px;min-height:1em}
.meta{margin:10px 0 0}.meta div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--bd);font-size:13px}.meta dd{margin:0;text-align:right;font-weight:600}
#toasts{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;z-index:30;pointer-events:none}
.toast{background:var(--gd);color:#fff;padding:10px 14px;border-radius:12px;pointer-events:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}.toast button{color:var(--am);font-weight:700}
.top{display:block;padding:12px 16px 14px;border-radius:0 0 20px 20px}
.tr{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.hk{margin:6px 0 0;font-size:12.5px;line-height:1.5;color:#cfe8dd;font-weight:400}
#app{padding-top:14px}
.kpi{display:flex;align-items:center;gap:14px}
.ring{--p:0;flex:none;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--bd) 0)}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--cd)}
.ring span{position:relative;font-size:20px;font-weight:800;color:var(--g)}
.slot-h{cursor:pointer}.row .ic{opacity:.55}
.ar{font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;font-size:21px;line-height:2;direction:rtl;text-align:right}.hk .ar{color:#fff}summary{cursor:pointer}
body{font-size:14px}.card,.card2{padding:10px;margin-bottom:10px}.big{font-size:28px}.ring{width:72px;height:72px}.ring::before{inset:7px}.ring span{font-size:18px}.pill{font-size:12.5px;padding:5px 11px}.dn h2{font-size:15px}.dg b{font-size:26px}.ar{font-size:20px}.ib{width:36px;height:36px}.row{padding:6px 0 6px 8px}.day{min-width:58px;padding:5px}
/* Tampilan ringkas untuk layar Android */
body{font-size:13px;line-height:1.35}
#app{padding:10px 10px 88px}
.top{padding:9px 14px 11px}.tr{font-size:16px}.hk{font-size:12px;line-height:1.4}.ar{font-size:18px;line-height:1.9}
.card,.card2{padding:8px 10px;margin-bottom:8px;border-radius:14px}
.dn h2{font-size:14px}.ib{width:32px;height:32px;border-radius:10px;font-size:12px}
.pill{font-size:12px;padding:4px 10px}.sc{gap:5px;padding-bottom:8px}
.day{min-width:50px;padding:4px;font-size:11px;border-radius:10px}
.big{font-size:24px}.ring{width:58px;height:58px}.ring::before{inset:6px}.ring span{font-size:15px}.kpi{gap:12px}
.sh2{margin-bottom:2px;font-size:13px}.sh2 small{font-size:11px}
.row{padding:4px 0 4px 6px;gap:2px}.row label{gap:8px;font-size:13px}
.chk{width:20px;height:20px;border-radius:6px}.chk:checked::before{font-size:13px}
.row label small{display:inline;margin-left:5px}
.cat{font-size:10px;padding:0 6px;margin:0 3px 0 0}
.ic{width:28px;height:28px;font-size:12px}
.add{padding:5px;font-size:12px;margin-top:4px;border-radius:8px}
.em{font-size:12px;margin:2px 0}
.sec{padding:8px;font-size:13px}
.nav button{padding:8px 0;font-size:13px}
.fab{width:48px;height:48px;font-size:26px;bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.ib.rec{background:#c62828;color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="tr"><span>☪ Yaumiyah ku</span><button id="cs" data-go="cloud" aria-label="Cloud" style="font-size:15px"></button></div><p id="hk" class="hk"></p></header>
<main id="app">
<div id="ty">
 <div class="dn"><button class="ib" data-go="prev" aria-label="Hari sebelumnya">◀</button><h2 id="yt"></h2><button class="ib" data-go="next" aria-label="Hari berikutnya">▶</button><label class="ib" style="margin:0;position:relative;display:grid;place-items:center">📅<input id="ydate" type="date" aria-label="Pilih tanggal"></label></div>
 <div class="sc" style="margin-top:10px"><button class="pill on" id="vj" data-go="yv|yj">📝 Jurnal</button><button class="pill" id="vr" data-go="yv|yr">📊 Rekap</button><button class="pill" data-go="today">Hari ini</button></div>
 <div id="yj"><small id="fs" style="margin:0 2px 8px"></small><form id="qc" class="dn" style="margin-bottom:10px"><input id="qi" maxlength="120" placeholder="Ketik atau tekan 🎤: sekolah hari Rabu jam 9 pagi" aria-label="Catat cepat" style="margin:0"><button class="ib" aria-label="Tambah">➕</button><button type="button" class="ib" id="mic" data-go="mic" aria-label="Bicara">🎤</button></form>
  <div class="card kpi" id="kcard"><div class="ring" id="kr"><span id="kp">0%</span></div><div style="flex:1"><b id="kl"></b><small id="kc"></small><button class="pill" data-go="reset" style="margin-top:8px">Ulangi hari ini</button></div></div>
  <div class="sc" id="dt"></div>
  <div class="sc" id="cf"></div>
  <div id="sl"></div>
  <div id="mh"></div><div class="act"><button class="sec" data-go="ts">🕒 Tambah jam</button></div>
 </div>
 <div id="yr" hidden>
  <div class="card"><b>Capaian 7 hari terakhir</b><div class="bars" id="ch" style="margin-top:10px"></div></div>
  <div class="card"><b>Capaian per kategori (hari ini)</b><div id="cp"></div></div>
  <div class="card" id="ins"></div><div class="card"><b>Riwayat 10 hari</b><table><tbody id="hs"></tbody></table></div><div class="act"><button class="sec" data-go="csv">Salin rekap (CSV)</button><button class="sec" data-go="prof">Profil & kategori</button></div>
 </div>
</div>
<div id="tc" hidden>
 <p class="mu" id="th" style="margin:0 0 10px"></p>
 <div class="hero" id="hero" data-go="hero"><span class="bd" id="hb">Acara terdekat</span><h2 id="hn"></h2><small id="hh"></small><small id="hm"></small>
  <div class="dg"><div><b id="g-d">00</b>hari</div><div><b id="g-h">00</b>jam</div><div><b id="g-m">00</b>menit</div><div><b id="g-s">00</b>detik</div></div>
  <div class="pb"><i id="hp"></i></div><small id="hpt"></small><p id="hdesc" class="mu" style="margin:6px 0 0"></p></div>
 <div class="dn" style="margin-bottom:8px"><b style="flex:1">Daftar acara (<span id="cn">0</span>)</b><button class="pill on" id="au" data-go="auto"></button></div>
 <div id="cl"></div>
</div>
</main>
<button class="fab" id="fab" data-go="fab" aria-label="Tambah">+</button>
<nav class="nav"><button id="n-y" data-go="tab|y" aria-selected="true">📝 Yaumiyah</button><button id="n-c" data-go="tab|c" aria-selected="false">⏳ Hitung Mundur</button></nav>
<div id="toasts" aria-live="polite"></div>
<div id="sheet" hidden><div id="sheetBox" role="dialog" aria-modal="true"></div></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),KEY='yaumiyahqu_app_v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(Math.max(0,Math.floor(n))).padStart(2,'0'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DAYS=['Ahad','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DC=[['Adminda','📋'],['Ubudiyah','🕌'],['Taklimiyah','📖'],['PSD','👥'],['Kapok','📌'],['Kesehatan','🌿'],['Wakepda','🏛️'],['Kada','⭐'],['Pribadi','🏠']];let CATS=DC,CI=Object.fromEntries(DC);const setCats=l=>{CATS=l;CI=Object.fromEntries(l)};
const SL=[['04:00','06:00','Subuh, dzikir & tilawah'],['06:00','08:00','Pagi & Dhuha'],['08:00','12:00','Kegiatan pagi–siang'],['12:00','15:30','Dzuhur & siang'],['15:30','18:00','Ashar & dzikir sore'],['18:00','21:30','Maghrib, Isya & taklimiyah']];
const AC=[
['Tahajud, Subuh berjamaah & dzikir pagi|Ubudiyah','Olahraga pagi|Kesehatan','Rencana program pekan ini|Kada','Dzuhur & silaturahmi keluarga|Pribadi','Siapkan berkas mingguan|Adminda','Kajian malam & murojaah|Taklimiyah'],
['Sahur puasa Senin, Subuh & dzikir|Ubudiyah','Shalat Dhuha & koordinasi awal pekan|Kada','Cek surat & laporan harian|Adminda','Dzuhur & rapat koordinasi|Wakepda','Pembinaan anggota|PSD','Buka puasa, Maghrib & kajian kitab|Taklimiyah'],
['Qiyamul lail, Subuh & tilawah|Ubudiyah','Senam pagi & Dhuha|Kesehatan','Pelaksanaan target kelompok|Kapok','Dzuhur & pendataan|Adminda','Evaluasi kaderisasi|PSD','Maghrib, Isya & mudzakarah|Taklimiyah'],
['Tahajud, Subuh & dzikir pagi|Ubudiyah','Jalan pagi & Dhuha|Kesehatan','Evaluasi tengah pekan|Wakepda','Dzuhur & pantau capaian|Kapok','Ashar, dzikir sore & urusan pribadi|Pribadi','Kajian sirah atau fiqih malam|Taklimiyah'],
['Sahur puasa Kamis & Subuh|Ubudiyah','Shalat Dhuha & supervisi|Kada','Rekap administrasi & arsip|Adminda','Dzuhur & pengembangan SDM|PSD','Ashar & doa menjelang buka puasa|Ubudiyah','Buka puasa & baca Al-Kahfi malam Jumat|Taklimiyah'],
['Tahajud, Subuh & Al-Kahfi|Ubudiyah','Mandi sunnah, olahraga & Dhuha|Kesehatan','Tuntaskan laporan mingguan|Adminda','Bersegera shalat Jumat & dzikir|Ubudiyah','Evaluasi akhir pekan & doa sore|Wakepda','Maghrib, Isya & waktu keluarga|Pribadi'],
['Qiyamul lail, Subuh & murojaah|Ubudiyah','Olahraga & istirahat|Kesehatan','Majelis ilmu & pembinaan|Taklimiyah','Dzuhur & evaluasi ringan|Kapok','Ashar, dzikir petang & urusan pribadi|Pribadi','Muhasabah akhir pekan|Kada']];
const ymd=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`,pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)},dow=s=>pd(s).getDay();
const fmtD=s=>{const d=pd(s);return`${DAYS[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`};
const DRE=/^\d{4}-\d\d-\d\d$/,TH_OK=['dynamic','red','orange','gold','green','blue','neutral'];

/* ---------- Data ---------- */
let DB,Y,C,cat='ALL',curD=null,sig='',lastDay='';
const fresh=()=>{const t=ymd(new Date());return{tab:'y',yq:{sch:{},chk:{},carry:[],hide:{},muh:{},date:t,last:t},cd:{list:[],auto:true,active:null},cl:{}}};
const valid=o=>o&&o.yq&&o.cd&&typeof o.yq.sch==='object'&&typeof o.yq.chk==='object'&&Array.isArray(o.yq.carry)&&Array.isArray(o.cd.list);
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(valid(o)){o.yq.hide=o.yq.hide||{};o.yq.muh=o.yq.muh||{};o.cl=o.cl||{};return o}}catch(e){console.warn('Data tersimpan tidak terbaca, memulai baru',e)}return fresh()}
function bind(){Y=DB.yq;C=DB.cd;setCats(Y.cats||DC)}
function saveRaw(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){console.error(e);toast('Data belum bisa disimpan. Penyimpanan penuh atau diblokir.')}}
function save(){wgQ();clQ();saveRaw()}
function toast(m,label,fn){const t=document.createElement('div');t.className='toast';t.textContent=m;if(fn){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{fn();t.remove()};t.append(b)}$('#toasts').append(t);setTimeout(()=>t.remove(),fn?7000:4000)}
function undoable(msg,fn){const s=JSON.stringify(DB);fn();save();rAll();toast(msg,'Urungkan',()=>{const cl=DB.cl;DB=JSON.parse(s);DB.cl=cl;bind();save();rAll()})}

/* ---------- Sheet ---------- */
function sheet(title,body){const b=$('#sheetBox');b.innerHTML=`<div class="sht"><b>${title}</b><button data-close aria-label="Tutup">✕</button></div>${body}`;$('#sheet').hidden=false;return b}
function closeSheet(){$('#sheet').hidden=true;curD=null}

/* ---------- Yaumiyah ---------- */
function day(d){if(!Y.sch[d])Y.sch[d]={slots:SL.map((s,i)=>({id:`d${d}s${i}`,s:s[0],e:s[1],l:s[2]})),acts:AC[d].map((a,i)=>{const[t,c]=a.split('|');return{id:`d${d}a${i}`,sl:`d${d}s${i}`,t,c}})};return Y.sch[d]}
const doneOn=id=>Object.keys(Y.chk).sort().find(d=>Y.chk[d]&&Y.chk[d][id]);
const carryVis=(c,ds)=>{const d=doneOn(c.id);return ds>=c.date&&!(d&&d<ds)};
function eff(ds){const b=day(dow(ds)),slots=b.slots.map(s=>({...s})),acts=b.acts.filter(a=>!(Y.hide[ds]&&Y.hide[ds][a.id])).map(a=>({...a,carry:0}));
 Y.carry.forEach(c=>{if(!carryVis(c,ds))return;let s=slots.find(x=>x.s===c.s)||slots[0];if(!s){s={id:'v'+c.id,s:c.s,e:c.e,l:c.l};slots.push(s)}acts.push({id:c.id,sl:s.id,t:c.t,c:c.c,carry:1})});
 return{slots:slots.sort((a,b)=>a.s.localeCompare(b.s)),acts}}
function stats(ds){const e=eff(ds),ck=Y.chk[ds]||{},n=e.acts.length,dn=e.acts.filter(a=>ck[a.id]).length;let sa=0,sd=0;
 e.slots.forEach(s=>{const l=e.acts.filter(a=>a.sl===s.id);if(l.length){sa++;if(l.every(a=>ck[a.id]))sd++}});
 return{n,dn,pct:n?Math.round(dn/n*100):0,sa,sd,cy:e.acts.filter(a=>a.carry&&!ck[a.id]).length}}
function rY(){const ds=Y.date,d=dow(ds),st=stats(ds),e=eff(ds),ck=Y.chk[ds]||{};
 $('#ydate').value=ds;$('#yt').textContent=fmtD(ds);$('#kp').textContent=st.pct+'%';$('#kr').style.setProperty('--p',st.pct);

const SRN=()=>{try{return window.Capacitor&&Capacitor.isNativePlatform()?(Capacitor.Plugins.SpeechRecognition||null):null}catch(e){return null}};
var WR=null,micOn=false;

async function listen(){if(micOn)return stopMic();const N=SRN();
 if(N){try{let p=await N.checkPermissions();
   if(p.speechRecognition!=='granted'){p=await N.requestPermissions();if(p.speechRecognition!=='granted')return toast('Izin mikrofon belum diberikan. Aktifkan di Pengaturan HP → Aplikasi → Yaumiyah ku → Izin.')}

   const t=r&&r.matches&&r.matches[0];if(!t||!t.trim())return toast('Suara tidak terdengar. Coba lagi dengan lebih jelas.');quick(t)}
  catch(e){micUI(false);console.warn(e);const m=String(e&&e.message||e);toast(/cancel|no match|no speech|not match|timeout/i.test(m)?'Tidak ada suara yang dikenali. Coba lagi.':/not available|unavailable|activity|service/i.test(m)?'Layanan suara tidak ditemukan. Pasang atau aktifkan aplikasi Google di HP.':'Pengenalan suara gagal: '+m)}return}

 try{const r=new SR();WR=r;r.lang='id-ID';r.interimResults=false;r.maxAlternatives=1;micUI(true);
  r.onresult=ev=>quick(ev.results[0][0].transcript);r.onend=()=>micUI(false);
  r.onerror=ev=>{micUI(false);toast(ev.error==='not-allowed'?'Izin mikrofon ditolak.':ev.error==='no-speech'?'Tidak ada suara terdengar. Coba lagi.':'Suara gagal: '+ev.error)};r.start()}
 catch(e){micUI(false);console.warn(e);toast('Mikrofon tidak bisa dijalankan.')}}

 const v=a.map((l,i)=>[l.length>1?l.reduce((p,c)=>p+c,0)/l.length:null,i]).filter(x=>x[0]!=null).sort((p,q)=>p[0]-q[0]),tot=Object.values(Y.chk).reduce((p,c)=>p+Object.keys(c).length,0),gd=tot>150?'🌳🌸':tot>60?'🌳':tot>20?'🌿':'🌱';
 $('#ins').innerHTML=`<b>Evaluasi pekan</b><p style="margin:6px 0">${v.length>1&&v[0][0]<v[v.length-1][0]-10?`Capaianmu paling rendah di hari ${DAYS[v[0][1]]} (rata-rata ${Math.round(v[0][0])}%). Coba ringankan kegiatan hari itu atau pindahkan sebagian ke hari ${DAYS[v[v.length-1][1]]}.`:'Belum cukup data untuk membaca pola. Teruslah istiqamah beberapa hari lagi.'}</p><small>Kebun amalmu: ${gd} · ${tot} amalan tuntas</small>`}
function copyCsv(){const t=ymd(new Date()),r=['Tanggal,Hari,Selesai,Total,Persen'];for(let i=29;i>=0;i--){const x=addD(t,-i),s=stats(x);r.push(`${x},${DAYS[dow(x)]},${s.dn},${s.n},${s.pct}`)}
 (navigator.clipboard?navigator.clipboard.writeText(r.join('\n')):Promise.reject()).then(()=>toast('Rekap 30 hari disalin. Tempel di Excel, Sheets, atau WhatsApp.'),()=>toast('Tidak bisa menyalin. Izinkan akses papan klip.'))}

/* ---------- Widget layar utama (jembatan ke kode native) ---------- */
const WB=()=>{try{return window.Capacitor&&Capacitor.isNativePlatform()?(Capacitor.Plugins.WidgetBridge||null):null}catch(e){return null}};
var wgT=null;
function wgQ(){if(!WB())return;clearTimeout(wgT);wgT=setTimeout(wgPush,800)}
async function wgPull(){const W=WB();if(!W)return;try{const r=await W.takePending();let ch=false;
 String(r.items||'').split(';').filter(Boolean).forEach(x=>{const[d,id,v]=x.split('|');if(DRE.test(d)&&id){const m=Y.chk[d]=Y.chk[d]||{};if(v==='0')delete m[id];else m[id]=1;ch=true}});if(ch){save();rY()}}catch(e){console.warn(e)}}
async function wgPush(){const W=WB();if(!W)return;try{const ds=ymd(new Date()),e=eff(ds),ck=Y.chk[ds]||{},st=stats(ds),now=Date.now(),up=C.list.filter(i=>+new Date(i.target)>now),sOf=a=>(e.slots.find(s=>s.id===a.sl)||{s:''}).s;
 const d={d:ds,n:st.n,dn:st.dn,tk:e.acts.map(a=>({id:a.id,h:sOf(a),t:a.t.slice(0,60),x:ck[a.id]?1:0})).sort((p,q)=>p.h.localeCompare(q.h)),evs:up.slice(0,20).map(i=>({n:i.name.slice(0,40),ts:+new Date(i.target)}))};
 if(up[0]){d.ts=+new Date(up[0].target);d.en=up[0].name.slice(0,30)}await W.set({json:JSON.stringify(d)})}catch(x){console.warn(x)}}

/* ---------- Sinkronisasi cloud (Supabase, offline-first) ---------- */
const SB={url:'https://jeduzsituiexxcyadcgk.supabase.co',key:'sb_publishable_EFJikLoLHKOmFlPcd1v1Gg_rnZffKfG'};
const CFG=()=>{const c=DB.cl.cfg||{};return{url:(SB.url||c.url||'').replace(/\/+$/,''),key:SB.key||c.key||''}};
const payload=()=>({v:1,yq:{sch:Y.sch,chk:Y.chk,carry:Y.carry,hide:Y.hide,muh:Y.muh,cats:Y.cats||null,persona:Y.persona||null},cd:{list:C.list,auto:C.auto,active:C.active}});
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)+s.length};
async function sb(path,o={}){const{url,key}=CFG();if(!url||!key)throw new Error('Alamat server belum diisi.');
 const h={apikey:key,'Content-Type':'application/json',...(o.headers||{})};if(o.auth!==false){await tokenOk();h.Authorization='Bearer '+DB.cl.tok.a}
 const r=await fetch(url+path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined}),t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){console.warn(e)}
 if(!r.ok)throw new Error((j&&(j.error_description||j.msg||j.message))||('Kesalahan server '+r.status));return j}
const expAt=j=>Math.floor(Date.now()/1000)+(j.expires_in||3600);
async function tokenOk(){const t=DB.cl.tok;if(!t)throw new Error('Belum masuk.');if(t.exp-60>Date.now()/1000)return;
 try{const j=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:t.r}});DB.cl.tok={...t,a:j.access_token,r:j.refresh_token,exp:expAt(j)};saveRaw()}
 catch(e){if(e instanceof TypeError)throw e;DB.cl.tok=null;saveRaw();clStat();throw new Error('Sesi berakhir. Silakan masuk lagi.')}}
async function clAuth(up,em,pw){const j=await sb(up?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email:em,password:pw}});
 if(!j.access_token)return 'confirm';DB.cl.tok={a:j.access_token,r:j.refresh_token,exp:expAt(j),uid:j.user.id,em:j.user.email};DB.cl.rev=null;DB.cl.h=null;saveRaw();return 'ok'}
function applyCloud(p){const q=p.yq||{};Object.assign(Y,{sch:q.sch||{},chk:q.chk||{},carry:Array.isArray(q.carry)?q.carry:[],hide:q.hide||{},muh:q.muh||{},cats:Array.isArray(q.cats)?q.cats:null,persona:q.persona||Y.persona});
 if(p.cd){C.list=(Array.isArray(p.cd.list)?p.cd.list:[]).slice(0,200);C.auto=p.cd.auto!==false;C.active=p.cd.active||null}setCats(Y.cats||DC);ensure()}
function mergeIn(p,pc){const q=p.yq||{},c=p.cd||{},m=JSON.parse(JSON.stringify(payload())),my=m.yq,mc=m.cd;
 Object.keys(q.chk||{}).forEach(d=>{my.chk[d]=Object.assign({},q.chk[d],my.chk[d])});
 const ids=new Set(my.carry.map(x=>x.id));(q.carry||[]).forEach(x=>{if(!ids.has(x.id))my.carry.push(x)});
 Object.keys(q.hide||{}).forEach(d=>{my.hide[d]=Object.assign({},q.hide[d],my.hide[d])});
 Object.keys(q.muh||{}).forEach(d=>{if(!my.muh[d])my.muh[d]=q.muh[d]});
 const cid=new Set(mc.list.map(x=>x.id));(c.list||[]).forEach(x=>{if(!cid.has(x.id))mc.list.push(x)});
 if(pc&&(q.persona||Object.keys(q.sch||{}).length)){my.sch=q.sch||{};my.cats=q.cats||null;my.persona=q.persona||my.persona}
 else if(!Object.keys(my.sch).length&&q.sch){my.sch=q.sch;my.cats=q.cats||my.cats}
 applyCloud(m)}
async function clPush(rev,json,h){const L=DB.cl,r=await sb(`/rest/v1/app_state?user_id=eq.${L.tok.uid}&rev=eq.${rev}`,{method:'PATCH',body:{data:JSON.parse(json),rev:rev+1},headers:{Prefer:'return=representation'}});
 if(!r||!r.length)throw new Error('KONFLIK');L.rev=r[0].rev;L.h=h}
let clBusy=false,clT=null;
function clStat(m,k){const L=DB.cl;if(m!==undefined)L.msg=m;const e=$('#cs');if(!e)return;e.textContent=!L.tok?'☁️':k==='err'?'☁️❗':k==='off'?'☁️…':'☁️✓';e.title=L.msg||''}
function clQ(){if(!DB.cl||!DB.cl.tok)return;clearTimeout(clT);clT=setTimeout(()=>cloudSync(),4000)}
async function cloudSync(manual,n=0){const L=DB.cl;if(!L||!L.tok||clBusy)return;if(navigator.onLine===false)return clStat('Offline: akan disinkronkan nanti','off');
 clBusy=true;
 try{const uid=L.tok.uid,rows=await sb(`/rest/v1/app_state?select=data,rev&user_id=eq.${uid}`),row=rows&&rows[0],mine=JSON.stringify(payload()),h=hash(mine),dirty=h!==L.h;
  if(!row){const r=await sb('/rest/v1/app_state?on_conflict=user_id',{method:'POST',body:{user_id:uid,data:JSON.parse(mine),rev:1},headers:{Prefer:'resolution=merge-duplicates,return=representation'}});L.rev=r[0].rev;L.h=h}
  else if(row.rev===L.rev){if(dirty)await clPush(row.rev,mine,h)}
  else{if(L.rev==null||dirty){mergeIn(row.data,L.rev==null);const m2=JSON.stringify(payload());await clPush(row.rev,m2,hash(m2))}
   else{applyCloud(row.data);L.rev=row.rev;L.h=hash(JSON.stringify(payload()))}
   saveRaw();wgQ();rAll()}
  L.at=Date.now();saveRaw();clStat('Tersinkron '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}))}
 catch(e){if(e.message==='KONFLIK'&&n<2){clBusy=false;return cloudSync(manual,n+1)}console.warn(e);clStat(e instanceof TypeError?'Offline: akan disinkronkan nanti':e.message,e instanceof TypeError?'off':'err');if(manual)toast(DB.cl.msg)}
 finally{clBusy=false}}
function cloudSheet(){const L=DB.cl,c=CFG(),tok=L.tok;let h;
 if(!c.url||!c.key)h=`<p class="mu">Isi alamat server sekali saja. Buat proyek gratis di supabase.com, jalankan berkas SQL, lalu salin Project URL dan kunci publishable dari Settings → API Keys.</p><label>Project URL<input id="c1" inputmode="url" placeholder="https://xxxx.supabase.co"></label><label>Kunci publishable<input id="c2" placeholder="sb_publishable_..."></label><div class="err" id="er"></div><button class="pri" id="c3">Simpan</button>`;
 else if(!tok)h=`<p class="mu">Masuk agar data tersimpan aman dan bisa dipulihkan saat ganti HP. Aplikasi tetap bisa dipakai tanpa sinyal.</p><label>Email<input id="c4" type="email" autocomplete="email"></label><label>Kata sandi (min. 8 karakter)<input id="c5" type="password" autocomplete="current-password"></label><div class="err" id="er"></div><div class="act"><button class="sec" id="c6">Masuk</button><button class="sec" id="c7">Daftar</button></div>`;
 else h=`<p>Masuk sebagai <b>${esc(tok.em)}</b></p><small id="c8"></small><div class="act"><button class="sec" id="c9">Sinkronkan sekarang</button><button class="sec" id="ca">Keluar</button></div><button class="sec dng" id="cb" style="width:100%;margin-top:8px">Hapus data cloud</button><div class="err" id="er"></div>`;
 const b=sheet('☁️ Cloud',h),q=s=>b.querySelector(s),er=m=>{q('#er').textContent=m};
 if(!c.url||!c.key){q('#c3').onclick=()=>{const u=q('#c1').value.trim().replace(/\/+$/,''),k=q('#c2').value.trim();if(!/^https:\/\/[\w.-]+$/i.test(u))return er('Alamat harus diawali https://, contoh https://xxxx.supabase.co');if(k.length<20)return er('Kunci belum benar.');L.cfg={url:u,key:k};saveRaw();cloudSheet()};return}
 if(!tok){const go=async up=>{const em=q('#c4').value.trim(),pw=q('#c5').value;if(!em||pw.length<8)return er('Isi email dan kata sandi (min. 8 karakter).');er('Memproses…');
   try{const r=await clAuth(up,em,pw);closeSheet();if(r==='confirm')return toast('Pendaftaran berhasil. Cek email untuk konfirmasi, lalu masuk.');clStat();toast('Alhamdulillah, berhasil masuk.');await cloudSync(true)}catch(e){er(e instanceof TypeError?'Tidak ada sinyal.':e.message)}};
  q('#c6').onclick=()=>go(false);q('#c7').onclick=()=>go(true);return}
 q('#c8').textContent=L.at?'Terakhir tersinkron '+new Date(L.at).toLocaleString('id-ID'):'Belum pernah tersinkron';
 q('#c9').onclick=async()=>{await cloudSync(true);q('#c8').textContent=L.msg||''};
 q('#ca').onclick=()=>{L.tok=null;L.rev=null;L.h=null;saveRaw();closeSheet();clStat();toast('Keluar. Data di HP tetap ada.')};
 let sure=false;q('#cb').onclick=async e=>{if(!sure){sure=true;e.target.textContent='Yakin? Ketuk sekali lagi';return}
  try{await sb('/rest/v1/app_state?user_id=eq.'+tok.uid,{method:'DELETE'});L.tok=null;L.rev=null;L.h=null;saveRaw();closeSheet();clStat();toast('Data cloud dihapus. Data di HP tetap ada.')}catch(x){er(x.message)}}}

 tab:setTab,yv:v=>{$('#yj').hidden=v!=='yj';$('#yr').hidden=v!=='yr';$('#vj').classList.toggle('on',v==='yj');$('#vr').classList.toggle('on',v==='yr');rY()},

 auto:()=>{C.auto=!C.auto;ensure();save();rCD();toast(C.auto?'Acara paling dekat selalu di atas.':'Mode manual: ketuk acara lalu “Jadikan utama”.')}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-go]');if(el){e.stopPropagation();const[n,...r]=el.dataset.go.split('|');if(GO[n])GO[n](r.join('|'));return}
 if(e.target.id==='sheet'||e.target.closest('[data-close]'))closeSheet()});
