name: Bangun APK Yaumiyah ku

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setujui lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pasang dependensi dan siapkan aset web
        run: |
          npm install
          mkdir -p www
          if [ -f src/index.html ]; then cp src/index.html www/index.html; else cp index.html www/index.html; fi

      - name: Buat dan sinkronkan proyek Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Tambah izin Android (getar)
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          assert '<application' in s
          perm='    <uses-permission android:name="android.permission.VIBRATE" />\n'
          open(p,'w').write(s.replace('<application',perm+'    <application',1))
          PY

      - name: Pasang widget layar utama (kode native)
        run: |
          set -e
          J=android/app/src/main/java/id/yaumiyahqu/app
          R=android/app/src/main/res
          mkdir -p "$J" "$R/layout" "$R/xml" "$R/drawable" "$R/values"
          cat > "$J/MainActivity.java" <<'END_0'
          package id.yaumiyahqu.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(WidgetBridge.class);
                  super.onCreate(savedInstanceState);
              }
          }
          END_0
          cat > "$J/WidgetBridge.java" <<'END_1'
          package id.yaumiyahqu.app;

          import android.content.Context;
          import android.content.SharedPreferences;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "WidgetBridge")
          public class WidgetBridge extends Plugin {

              @PluginMethod
              public void set(PluginCall call) {
                  String json = call.getString("json");
                  if (json == null) {
                      call.reject("Data widget kosong");
                      return;
                  }
                  Context c = getContext();
                  c.getSharedPreferences(WidgetProvider.PREFS, Context.MODE_PRIVATE).edit().putString("data", json).apply();
                  WidgetProvider.refreshAll(c);
                  CountdownProvider.refreshAll(c);
                  call.resolve();
              }

              @PluginMethod
              public void takePending(PluginCall call) {
                  SharedPreferences p = getContext().getSharedPreferences(WidgetProvider.PREFS, Context.MODE_PRIVATE);
                  String items = p.getString("pending", "");
                  p.edit().remove("pending").apply();
                  JSObject r = new JSObject();
                  r.put("items", items);
                  call.resolve(r);
              }
          }
          END_1
          cat > "$J/WidgetProvider.java" <<'END_2'
          package id.yaumiyahqu.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.widget.RemoteViews;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.Locale;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /** Widget "Kegiatan": hitung mundur terdekat, capaian, dan daftar kegiatan hari ini (bergulir). */
          public class WidgetProvider extends AppWidgetProvider {
              static final String PREFS = "yq_widget";
              static final String ACT_TOGGLE = "id.yaumiyahqu.app.TOGGLE";
              static final int FLAGS = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
              static final int FLAGS_MUTABLE = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_MUTABLE;

              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  for (int id : ids) render(c, m, id);
              }

              @Override
              public void onReceive(Context c, Intent i) {
                  if (ACT_TOGGLE.equals(i.getAction())) {
                      toggle(c, i.getStringExtra("id"));
                      refreshAll(c);
                      return;
                  }
                  super.onReceive(c, i);
              }

              static void refreshAll(Context c) {
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  for (int id : m.getAppWidgetIds(new ComponentName(c, WidgetProvider.class))) render(c, m, id);
              }

              /** Ketuk baris: centang bila belum, batalkan centang bila sudah. Dicatat agar aplikasi menyusul. */
              private static void toggle(Context c, String taskId) {
                  if (taskId == null) return;
                  SharedPreferences p = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  try {
                      JSONObject d = new JSONObject(p.getString("data", "{}"));
                      JSONArray tk = d.optJSONArray("tk");
                      if (tk == null) return;
                      int now = -1;
                      for (int i = 0; i < tk.length(); i++) {
                          JSONObject o = tk.getJSONObject(i);
                          if (taskId.equals(o.optString("id"))) {
                              now = o.optInt("x", 0) == 0 ? 1 : 0;
                              o.put("x", now);
                          }
                      }
                      if (now < 0) return;
                      d.put("dn", Math.max(0, d.optInt("dn", 0) + (now == 1 ? 1 : -1)));
                      p.edit()
                          .putString("data", d.toString())
                          .putString("pending", p.getString("pending", "") + d.optString("d") + "|" + taskId + "|" + now + ";")
                          .apply();
                  } catch (Exception e) {
                      // Data rusak: diabaikan, aplikasi akan menulis ulang saat dibuka.
                  }
              }

              static long dayStart(long t) {
                  Calendar k = Calendar.getInstance();
                  k.setTimeInMillis(t);
                  k.set(Calendar.HOUR_OF_DAY, 0);
                  k.set(Calendar.MINUTE, 0);
                  k.set(Calendar.SECOND, 0);
                  k.set(Calendar.MILLISECOND, 0);
                  return k.getTimeInMillis();
              }

              private static void render(Context c, AppWidgetManager m, int widgetId) {
                  RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_yaumiyah);
                  SharedPreferences p = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  long now = System.currentTimeMillis();
                  String today = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(new Date(now));
                  String ev = "Belum ada acara";
                  String msg = "Buka aplikasi untuk memulai.";
                  int pct = 0;
                  try {
                      String raw = p.getString("data", null);
                      if (raw != null) {
                          JSONObject d = new JSONObject(raw);
                          if (d.has("ts")) {
                              long ts = d.getLong("ts");
                              String nm = d.optString("en");
                              long days = Math.round((dayStart(ts) - dayStart(now)) / 86400000.0);
                              if (ts <= now) ev = "Waktu tiba · " + nm;
                              else if (days <= 0) ev = "Hari ini · " + nm;
                              else ev = "H-" + days + "  " + nm;
                          }
                          int n = d.optInt("n", 0);
                          int dn = d.optInt("dn", 0);
                          pct = n > 0 ? Math.min(100, dn * 100 / n) : 0;
                          msg = today.equals(d.optString("d")) ? "Belum ada kegiatan hari ini."
                                                                : "Buka aplikasi untuk memuat kegiatan hari ini.";
                      }
                  } catch (Exception e) {
                      msg = "Buka aplikasi untuk memuat ulang.";
                  }

                  v.setTextViewText(R.id.ev, ev);
                  v.setTextViewText(R.id.pc, pct + "%");
                  v.setProgressBar(R.id.pb, 100, pct, false);
                  v.setTextViewText(R.id.empty, msg);

                  Intent li = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
                  if (li != null) v.setOnClickPendingIntent(R.id.root, PendingIntent.getActivity(c, 1, li, FLAGS));

                  Intent si = new Intent(c, TaskService.class);
                  si.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, widgetId);
                  si.setData(Uri.parse(si.toUri(Intent.URI_INTENT_SCHEME)));
                  v.setRemoteAdapter(R.id.list, si);
                  v.setEmptyView(R.id.list, R.id.empty);
                  Intent tpl = new Intent(c, WidgetProvider.class).setAction(ACT_TOGGLE);
                  v.setPendingIntentTemplate(R.id.list, PendingIntent.getBroadcast(c, 0, tpl, FLAGS_MUTABLE));

                  m.updateAppWidget(widgetId, v);
                  m.notifyAppWidgetViewDataChanged(widgetId, R.id.list);
              }
          }
          END_2
          cat > "$J/TaskService.java" <<'END_3'
          package id.yaumiyahqu.app;

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import android.widget.RemoteViewsService;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /** Penyedia baris daftar kegiatan hari ini (urut dari awal sampai akhir). */
          public class TaskService extends RemoteViewsService {
              @Override
              public RemoteViewsFactory onGetViewFactory(Intent intent) {
                  return new Factory(getApplicationContext());
              }

              static class Factory implements RemoteViewsService.RemoteViewsFactory {
                  private final Context c;
                  private final List<String[]> rows = new ArrayList<>();

                  Factory(Context c) {
                      this.c = c;
                  }

                  @Override
                  public void onCreate() {
                  }

                  @Override
                  public void onDataSetChanged() {
                      rows.clear();
                      try {
                          SharedPreferences p = c.getSharedPreferences(WidgetProvider.PREFS, Context.MODE_PRIVATE);
                          String raw = p.getString("data", null);
                          if (raw == null) return;
                          JSONObject d = new JSONObject(raw);
                          String today = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(new Date());
                          if (!today.equals(d.optString("d"))) return;
                          JSONArray tk = d.optJSONArray("tk");
                          if (tk == null) return;
                          for (int i = 0; i < tk.length(); i++) {
                              JSONObject o = tk.getJSONObject(i);
                              rows.add(new String[] {
                                  o.optString("id"), o.optString("h"), o.optString("t"), String.valueOf(o.optInt("x", 0))
                              });
                          }
                      } catch (Exception e) {
                          rows.clear();
                      }
                  }

                  @Override
                  public void onDestroy() {
                      rows.clear();
                  }

                  @Override
                  public int getCount() {
                      return rows.size();
                  }

                  @Override
                  public RemoteViews getViewAt(int i) {
                      RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_task_item);
                      if (i < 0 || i >= rows.size()) return v;
                      String[] r = rows.get(i);
                      boolean done = "1".equals(r[3]);
                      v.setTextViewText(R.id.ti, r[1]);
                      v.setTextViewText(R.id.tt, (done ? "✓  " : "○  ") + r[2]);
                      v.setTextColor(R.id.tt, done ? 0xFF7FA595 : 0xFFFFFFFF);
                      v.setOnClickFillInIntent(R.id.row, new Intent().putExtra("id", r[0]));
                      return v;
                  }

                  @Override
                  public RemoteViews getLoadingView() {
                      return null;
                  }

                  @Override
                  public int getViewTypeCount() {
                      return 1;
                  }

                  @Override
                  public long getItemId(int i) {
                      return i;
                  }

                  @Override
                  public boolean hasStableIds() {
                      return true;
                  }
              }
          }
          END_3
          cat > "$J/CountdownProvider.java" <<'END_4'
          package id.yaumiyahqu.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.widget.RemoteViews;

          /** Widget "Hitung Mundur": semua acara mendatang, bergulir. Ketuk untuk membuka aplikasi. */
          public class CountdownProvider extends AppWidgetProvider {
              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  for (int id : ids) render(c, m, id);
              }

              static void refreshAll(Context c) {
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  for (int id : m.getAppWidgetIds(new ComponentName(c, CountdownProvider.class))) render(c, m, id);
              }

              private static void render(Context c, AppWidgetManager m, int widgetId) {
                  RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_countdown);
                  v.setTextViewText(R.id.cempty, "Belum ada acara. Tambahkan di aplikasi.");

                  Intent si = new Intent(c, CountdownService.class);
                  si.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, widgetId);
                  si.setData(Uri.parse(si.toUri(Intent.URI_INTENT_SCHEME)));
                  v.setRemoteAdapter(R.id.clist, si);
                  v.setEmptyView(R.id.clist, R.id.cempty);

                  Intent li = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
                  if (li != null) {
                      PendingIntent open = PendingIntent.getActivity(c, 2, li, WidgetProvider.FLAGS_MUTABLE);
                      v.setPendingIntentTemplate(R.id.clist, open);
                      v.setOnClickPendingIntent(R.id.croot, open);
                  }
                  m.updateAppWidget(widgetId, v);
                  m.notifyAppWidgetViewDataChanged(widgetId, R.id.clist);
              }
          }
          END_4
          cat > "$J/CountdownService.java" <<'END_5'
          package id.yaumiyahqu.app;

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import android.widget.RemoteViewsService;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /** Penyedia baris daftar acara mendatang beserta sisa harinya (H-N). */
          public class CountdownService extends RemoteViewsService {
              @Override
              public RemoteViewsFactory onGetViewFactory(Intent intent) {
                  return new Factory(getApplicationContext());
              }

              static class Factory implements RemoteViewsService.RemoteViewsFactory {
                  private final Context c;
                  private final List<Object[]> rows = new ArrayList<>();
                  private final SimpleDateFormat fmt = new SimpleDateFormat("EEE, d MMM yyyy · HH.mm", new Locale("id", "ID"));

                  Factory(Context c) {
                      this.c = c;
                  }

                  @Override
                  public void onCreate() {
                  }

                  @Override
                  public void onDataSetChanged() {
                      rows.clear();
                      try {
                          SharedPreferences p = c.getSharedPreferences(WidgetProvider.PREFS, Context.MODE_PRIVATE);
                          String raw = p.getString("data", null);
                          if (raw == null) return;
                          JSONArray evs = new JSONObject(raw).optJSONArray("evs");
                          if (evs == null) return;
                          long now = System.currentTimeMillis();
                          for (int i = 0; i < evs.length(); i++) {
                              JSONObject o = evs.getJSONObject(i);
                              long ts = o.getLong("ts");
                              if (ts > now) rows.add(new Object[] {o.optString("n"), Long.valueOf(ts)});
                          }
                      } catch (Exception e) {
                          rows.clear();
                      }
                  }

                  @Override
                  public void onDestroy() {
                      rows.clear();
                  }

                  @Override
                  public int getCount() {
                      return rows.size();
                  }

                  @Override
                  public RemoteViews getViewAt(int i) {
                      RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_cd_item);
                      if (i < 0 || i >= rows.size()) return v;
                      Object[] r = rows.get(i);
                      long ts = ((Long) r[1]).longValue();
                      long now = System.currentTimeMillis();
                      long days = Math.round((WidgetProvider.dayStart(ts) - WidgetProvider.dayStart(now)) / 86400000.0);
                      v.setTextViewText(R.id.cd, days <= 0 ? "Hari ini" : "H-" + days);
                      v.setTextColor(R.id.cd, days <= 1 ? 0xFFFF8A80 : days <= 7 ? 0xFFF5B73C : 0xFF8BE0B8);
                      v.setTextViewText(R.id.cn, (String) r[0]);
                      v.setTextViewText(R.id.cm, fmt.format(new Date(ts)));
                      v.setOnClickFillInIntent(R.id.crow, new Intent());
                      return v;
                  }

                  @Override
                  public RemoteViews getLoadingView() {
                      return null;
                  }

                  @Override
                  public int getViewTypeCount() {
                      return 1;
                  }

                  @Override
                  public long getItemId(int i) {
                      return i;
                  }

                  @Override
                  public boolean hasStableIds() {
                      return true;
                  }
              }
          }
          END_5
